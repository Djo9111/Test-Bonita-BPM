services:
  bonita:
    image: bonita:2025.2
    container_name: bonita-test
    ports:
      - "8081:8080"
    environment:
      - BONITA_RUNTIME_ADMIN_USERNAME=tech_user
      - BONITA_RUNTIME_ADMIN_PASSWORD=secret
      - PLATFORM_LOGIN=platformAdmin
      - PLATFORM_PASSWORD=platform

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit-test
    ports:
      - "8025:8025"
      - "1025:1025"